# CAITLYN Configuration

[llm]
provider = "openrouter"
model = "deepseek/deepseek-v4-pro"
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
small_model = "deepseek/deepseek-v4-pro"

[scanning]
max_parallel_tier1 = 5
max_parallel_tier2 = 5
# 单个 Tier 1 检测器 LLM 调用的超时（毫秒），超时按失败处理、不阻塞整轮
# 全量 ensemble 有 17 个检测器，超时放宽到 120s；HTTP server 同步放宽
tier1_timeout_ms = 120000
tier2_timeout_ms = 3000
tier3_timeout_ms = 15000
# Tier 1 分级触发：safe（默认，干净输入跑 fast 子集，弱信号跑全量）|
# aggressive（信任的干净输入跳过 LLM，低信任/高风险跑 fast 子集）| off（全量）
escalation_policy = "safe"
# fast 子集检测器（干净输入也至少跑这些，保证召回不塌方）
fast_detector_ids = "ab-classifier-injection,ab-classifier-jailbreak,ab-builtin-poisoning"
# Tier 0 malicious 但置信度低于该值视为弱信号（suspicious 恒为弱信号）
weak_signal_threshold = 0.6
# 默认来源信任度：high | medium | low（daemon 请求可逐次覆盖）
source_trust = "medium"
# 任务是否高风险（代码执行/改数据/网络外发）；safe 下直接升全量
high_risk = false

[vaccination]
min_samples = 5
min_success_rate = 0.7
latency_threshold_us = 2000000
token_threshold = 4000
shm_variants = 10
shm_base_temperature = 0.8
max_survivors = 3
affinity_recall_weight = 0.7
fp_tolerance = 0.05

[evolution]
# 有样本路径的自治等级：record | candidate | auto（默认 auto）
autonomy = "auto"
# 无样本路径（未知威胁）的处置：record | candidate | auto（默认 candidate）
unknown_threat_action = "candidate"
# 生成器读取 DAG 的粒度：meta | full（默认 meta）
dag_context = "meta"
# 生成器/评审模型；缺省继承 [llm].model / [llm].small_model
# generator_model = "deepseek-v4-pro"
# reviewer_model = "deepseek-v4-flash"
candidates_per_run = 3
max_rounds = 5
max_tokens_per_run = 40000
active_cap = 256
fp_penalty_weight = 5
score_decay_days = 90
dormant_grace_days = 30
retire_inactive_days = 90
benign_samples = 5
max_benign_false_positives = 1
regex_timeout_ms = 200
shadow_window_days = 7
shadow_min_scans = 50
lessons_per_cluster = 10
# accept 候选是否再独立评审一次（评审一致性抽查；成本约翻倍）
consistency_recheck = false
# 生成器参考的相似样本簇大小（防过拟合参考上下文，非硬约束）
similar_samples = 3
# 候选全部失败时是否做定向微调兜底（SHM fallback）
shm_fallback = true
cooldown_minutes = 60
daily_evolution_limit = 10
# evolution_dir = "./.caitlyn-evolution"

[memory]
fts5_enabled = true
semantic_enabled = false
max_entries = 100000

[storage]
db_path = "./caitlyn.db"
antibody_dir = "./antibodies"
valset_dir = "./valsets"
