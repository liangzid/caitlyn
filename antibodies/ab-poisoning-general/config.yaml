id: "ab-poisoning-general"
name: "General Poisoning Detector"
parent_id: null
category: "poisoning"
tier: 0
threshold: 0.6
description: "Fast-path heuristic/regex-based detection of tool output and MCP response poisoning. Detects hidden instruction"
affinity_score: 0
created_at: "2026-07-25"
generation: 0
stats:
  total_scans: 13
  true_positives: 13
  false_positives: 0
  avg_latency_us: 82307.69230769231
deps:
  - "node"
  - "tsx"
signatures:
  - pattern: "\\b(IMPORTANT|ATTENTION|NOTICE|WARNING)\\s*(:|=|!)"
    type: "regex"
    label: "hidden-instruction"
  - pattern: "(your\\s+)?(real|actual|true|secret)\\s+(task|goal|purpose|mission)\\s+(is|was)"
    type: "regex"
    label: "real-task"
  - pattern: "(ignore|disregard)\\s+(the|all|any)\\s+(above|previous|earlier)"
    type: "regex"
    label: "ignore-above"
  - pattern: "(instead|rather)\\s*(,|than)"
    type: "regex"
    label: "instead"
  - pattern: "(you\\s+should|you\\s+must|please\\s+now)\\s+(also|additionally|next)"
    type: "regex"
    label: "tool-hijack"
  - pattern: "as\\s+(a|the)\\s+(next|following)\\s+(step|action|command)"
    type: "regex"
    label: "next-step"
  - pattern: "\\bnow\\s+(run|execute|call|invoke|fetch)\\b"
    type: "regex"
    label: "now-execute"
  - pattern: "(the\\s+)?(system|tool|server|admin)\\s+(says|requires|demands|insists)"
    type: "regex"
    label: "authority-claim"
  - pattern: "(confirmed|verified|authenticated)\\s+(by|through|via)"
    type: "regex"
    label: "fake-verification"
  - pattern: "this\\s+(is|was)\\s+(generated|produced|sent)\\s+(by|from)\\s+(the\\s+)?(system|admin)"
    type: "regex"
    label: "system-claim"
  - pattern: "(also|additionally|furthermore).*(fetch|get|retrieve|download)\\s+(more|additional|further)"
    type: "regex"
    label: "recursive-fetch"
  - pattern: "(check|see|look\\s+at)\\s+(this|the\\s+following|below)\\s+(URL|link|file|endpoint)"
    type: "regex"
    label: "check-link"
  - pattern: "(for\\s+)?(more|further|complete|full)\\s+(information|details|context).*(visit|see|check|fetch)"
    type: "regex"
    label: "more-info-link"
  - pattern: "\\b(system|admin|root|supervisor)\\s+(message|notification|alert):"
    type: "regex"
    label: "system-message-spoof"
  - pattern: "\\*\\*\\*(SYSTEM|ADMIN|ROOT)\\s+(MESSAGE|ALERT|NOTICE)\\*\\*\\*"
    type: "regex"
    label: "star-system-spoof"
  - pattern: "this\\s+data\\s+(is|was|has\\s+been)\\s+(verified|confirmed|validated|checked)"
    type: "regex"
    label: "fake-data-claim"
  - pattern: "(error|exception|failure|crash)\\s+(occurred|detected|found).*(you\\s+must|please|need\\s+to)"
    type: "regex"
    label: "error-bait"
