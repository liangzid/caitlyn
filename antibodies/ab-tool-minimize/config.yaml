id: "ab-tool-minimize"
name: "Tool Argument Minimizer"
parent_id: null
category: "exfiltration"
tier: 2
threshold: 0.75
description: "Experimental pre-call minimizer for removing unnecessary privacy-sensitive data from tool arguments"
prompt: |
  Given a trusted task objective, a tool schema, and proposed arguments,
  retain only values necessary for the tool to complete the authorized task.
  Prefer field removal, then generalization, substitution, or truncation.
  Preserve schema validity. Flag any sensitive value whose necessity cannot be
  justified from the objective and schema.
role: "non_detector"
implementation_status: "experimental"
execution_stages:
  - "tool_pre_call"
references:
