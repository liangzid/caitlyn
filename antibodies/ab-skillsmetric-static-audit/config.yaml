id: "ab-skillsmetric-static-audit"
name: "SkillsMetric Static Skill Auditor"
parent_id: null
category: "poisoning"
tier: 2
threshold: 0.75
description: "Experimental static admission analysis for pattern density, statistical anomalies, data flow, imports, and capability mismatch"
prompt: |
  Inspect the complete skill package across five dimensions: suspicious pattern
  density, statistical anomaly, source-to-sink data flow, import and dependency
  anomaly, and mismatch between declared purpose and requested capabilities.
  Report evidence per file and do not treat a clean static result as proof of
  safety. Escalate semantic instructions and ordinary-command host effects to
  dynamic review because these are known blind spots.
role: "non_detector"
implementation_status: "experimental"
execution_stages:
  - "skill_admission"
references:
  - title: "SkillsMetric: Mapping the Detection Boundary of Static Analysis for Malicious Agent Skills"
    url: "https://arxiv.org/abs/2608.08468"
    year: 2026
runtime_requirements:
  - "recursive skill artifact loader"
  - "source-to-sink static analysis"
  - "declared capability manifest"
affinity_score: 0
