[package]
name = "caitlyn"
version = "0.1.0"
edition = "2024"
description = "Continuous Agents for Injection Threats via Lifelong Yielding Nexus — Agentic, evolvable defense against LLM agent attacks"

[[bin]]
name = "caitlynd"
path = "src/main.rs"

[lib]
name = "caitlyn"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Config
toml = "0.8"
dirs = "6"

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
sha2 = "0.10"

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP client (LLM API calls)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Pattern matching
regex = "1"

# Error handling
thiserror = "2"


# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Binary encoding
base64 = "0.22"
anyhow = "1.0.103"
async-trait = "0.1.89"
futures = "0.3.32"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
