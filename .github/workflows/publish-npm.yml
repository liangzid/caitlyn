name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caitlyn-agent
    steps:
      - name: Check out the released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: caitlyn-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION."
            exit 1
          fi

      - name: Check whether the version already exists
        id: registry
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          if npm view "caitlyn@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package installation
        if: steps.registry.outputs.published != 'true'
        run: npm run test:package

      - name: Publish stable version
        if: steps.registry.outputs.published != 'true' && !github.event.release.prerelease
        run: npm publish --access public --provenance

      - name: Publish prerelease version
        if: steps.registry.outputs.published != 'true' && github.event.release.prerelease
        run: npm publish --access public --provenance --tag next
