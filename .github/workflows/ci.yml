name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caitlyn-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: caitlyn-agent/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (types + antibody precompile)
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Verify npm package installation
        run: npm run test:package

  agent-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentEval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Run Python tests
        run: pytest -q
